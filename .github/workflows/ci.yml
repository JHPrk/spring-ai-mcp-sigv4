name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [17, 21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: liberica
          java-version: "17.0.19"
      - name: Preserve the Java 17 compiler location
        run: echo "SIGV4_BUILD_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: matrix.runtime == 21
        with:
          distribution: liberica
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Verify Java runtime, publications, and Maven/Gradle consumers
        run: >-
          ./gradlew --no-daemon clean check publishToMavenLocal
          -PtestJavaVersion=${{ matrix.runtime }}
          -Dorg.gradle.java.installations.fromEnv=SIGV4_BUILD_JAVA_HOME,JAVA_HOME
          -Dorg.gradle.java.installations.auto-detect=false
      - name: Verify local release-candidate consumers
        if: matrix.runtime == 17
        run: >-
          ./gradlew --no-daemon verifyConsumers -PprojectVersion=0.1.0-RC1
          -Dorg.gradle.java.installations.fromEnv=SIGV4_BUILD_JAVA_HOME,JAVA_HOME
          -Dorg.gradle.java.installations.auto-detect=false
